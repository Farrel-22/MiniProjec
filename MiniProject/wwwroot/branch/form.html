<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branch - MiniProject</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="appNavbar"></div>
    <main class="container py-4 flex-grow-1">
        <div id="appAlert"></div>
        <h2 id="formTitle">Add Branch</h2>
        <form id="branchForm" novalidate>
            <div class="text-danger mb-3" data-summary></div>
            <input type="hidden" id="Uid" />
            <div class="mb-3">
                <label for="RefRegionId" class="form-label">Region</label>
                <select id="RefRegionId" class="form-select">
                    <option value="">-- Select Region --</option>
                </select>
                <span class="text-danger" data-field="RefRegionId"></span>
            </div>
            <div class="mb-3">
                <label for="TxtCode" class="form-label">Code</label>
                <input id="TxtCode" class="form-control" maxlength="50" />
                <span class="text-danger" data-field="TxtCode"></span>
            </div>
            <div class="mb-3">
                <label for="TxtName" class="form-label">Name</label>
                <input id="TxtName" class="form-control" maxlength="200" />
                <span class="text-danger" data-field="TxtName"></span>
            </div>
            <div class="mb-3">
                <label for="TxtAddress" class="form-label">Address</label>
                <textarea id="TxtAddress" class="form-control" rows="3" maxlength="500"></textarea>
                <span class="text-danger" data-field="TxtAddress"></span>
            </div>
            <button type="submit" class="btn btn-primary">Save</button> <a href="/branch/index.html" class="btn btn-secondary">Back</a>
        </form>
    </main>
    <footer class="border-top py-3 mt-auto">
        <div class="container"><small class="text-muted">© MiniProject</small></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/branch-form.js"></script>
</body>
</html>
