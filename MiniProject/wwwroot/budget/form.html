<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget - MiniProject</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="appNavbar"></div>
    <main class="container py-4 flex-grow-1">
        <div id="appAlert"></div>
        <h2 class="mb-4" id="formTitle">Add Budget</h2>
        <form id="budgetForm" novalidate>
            <input type="hidden" id="Uid" />
            <div class="text-danger mb-3" data-summary></div>
            <div class="mb-3">
                <label for="RefRegionId" class="form-label">Region</label>
                <select id="RefRegionId" class="form-select">
                    <option value="">-- Select Region --</option>
                </select>
                <span class="text-danger" data-field="RefRegionId"></span>
            </div>
            <div class="mb-3">
                <label for="RefBranchId" class="form-label">Branch</label>
                <select id="RefBranchId" class="form-select">
                    <option value="">-- Select Branch --</option>
                </select>
                <span class="text-danger" data-field="RefBranchId"></span>
            </div>
            <div class="mb-3">
                <label for="IntYear" class="form-label">Year</label>
                <input id="IntYear" type="number" class="form-control" min="2000" max="2100" />
                <span class="text-danger" data-field="IntYear"></span>
            </div>
            <div class="mb-3">
                <label for="DecAmount" class="form-label">Amount</label>
                <input id="DecAmount" type="number" step="0.01" class="form-control" />
                <span class="text-danger" data-field="DecAmount"></span>
            </div>
            <div class="mb-3">
                <label for="TxtDescription" class="form-label">Description</label>
                <textarea id="TxtDescription" rows="3" class="form-control" maxlength="500"></textarea>
                <span class="text-danger" data-field="TxtDescription"></span>
            </div>
            <button type="submit" class="btn btn-primary">Save</button> <a href="/budget/index.html" class="btn btn-secondary">Back</a>
        </form>
    </main>
    <footer class="border-top py-3 mt-auto">
        <div class="container"><small class="text-muted">© MiniProject</small></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/budget-form.js"></script>
</body>
</html>
