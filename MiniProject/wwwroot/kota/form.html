<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kota - MiniProject</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="appNavbar"></div>
    <main class="container py-4 flex-grow-1">
        <div id="appAlert"></div>
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4" id="formTitle">Tambah Kota</h3>
                <form id="kotaForm" novalidate>
                    <input type="hidden" id="Id" />
                    <div class="text-danger mb-3" data-summary></div>
                    <div class="mb-3">
                        <label for="Nama" class="form-label">Nama Kota</label>
                        <input id="Nama" class="form-control" maxlength="150" required placeholder="Masukkan nama kota" />
                        <span class="text-danger" data-field="Nama"></span>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Simpan</button>
                        <a href="/kota/index.html" class="btn btn-secondary">Kembali</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer class="border-top py-3 mt-auto">
        <div class="container"><small class="text-muted">© MiniProject</small></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/kota-form.js"></script>
</body>
</html>
