<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Region - MiniProject</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="appNavbar"></div>
    <main class="container py-4 flex-grow-1">
        <div id="appAlert"></div>
        <div class="card shadow-sm"><div class="card-body"><h3 class="card-title mb-4" id="formTitle">Add Region</h3><form id="regionForm" novalidate><input type="hidden" id="Uid" /><div class="text-danger mb-3" data-summary></div><div class="mb-3"><label for="TxtCode" class="form-label">Code</label><input id="TxtCode" class="form-control" maxlength="50" /><span class="text-danger" data-field="TxtCode"></span></div><div class="mb-3"><label for="TxtName" class="form-label">Name</label><input id="TxtName" class="form-control" maxlength="200" /><span class="text-danger" data-field="TxtName"></span></div><div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Save</button><a href="/region/index.html" class="btn btn-secondary">Back</a></div></form></div></div>
    </main>
    <footer class="border-top py-3 mt-auto">
        <div class="container"><small class="text-muted">© MiniProject</small></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/region-form.js"></script>
</body>
</html>
