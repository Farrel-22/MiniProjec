<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - MiniProject</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="d-flex flex-column min-vh-100">
    <main class="container py-4 flex-grow-1">
        <div id="appAlert"></div>
        <div class="row">
            <div class="col-md-4 mx-auto mt-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="card-title text-center mb-4">Sign in</h4>
                        <form id="loginForm" novalidate>
                            <div class="text-danger mb-3" data-summary></div>
                            <div class="mb-3">
                                <label for="Username" class="form-label">Username</label>
                                <input id="Username" class="form-control" autofocus />
                                <span class="text-danger" data-field="Username"></span>
                            </div>
                            <div class="mb-3">
                                <label for="Password" class="form-label">Password</label>
                                <input id="Password" type="password" class="form-control" />
                                <span class="text-danger" data-field="Password"></span>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                        <p class="text-muted small text-center mt-3 mb-0">Default: admin / Admin@123</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="border-top py-3 mt-auto">
        <div class="container"><small class="text-muted">© MiniProject</small></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
